apply plugin: 'com.android.library'

android {
    namespace "com.unity.networking.backgrounddownload"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 28
    }
}

dependencies {
    // OkHttp for background downloading
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

